app_id: nimi.polyagent
display_name: PolyAgent
version: 0.1.0
profile: standalone
manifest_role: submitted-input
app_access:
  - agent.work
  - integration.consume
  - app.activity
capability_contract_refs: []
required_standardized_feature_refs: []
storage_policy:
  kind: app-owned-os-storage
  os_storage_disclosure:
    - path_pattern: macOS Keychain / ai.nimi.polyagent.executor.secrets / executor-*
      purpose: Executor bearer and Relayer credential. Ordinary configuration stores only references.
      expected_size_band: A few kilobytes per configured executor.
    - path_pattern: macOS Keychain / ai.nimi.polyagent.polymarket.signer / polyagent-*
      purpose: User-imported Polymarket signing key, stored directly as a Keychain
        item. App metadata uses Nimi managed storage; no plaintext key file.
      expected_size_band: One 32-byte secret per imported signer.
    - path_pattern: <user-home>/.polyagent-executor/**
      purpose: Selected external executor submission journal, signed order material
        and process lock. Contains no wallet private key. A user-selected
        executor state directory can replace this root.
      expected_size_band: Typically KiB to MiB of JSON, grows with orders.
metadata:
  summary: 让你的 Nimi Agent 监控预测市场、执行受约束策略并管理订单与持仓。
  icon: assets/app-icon.png
  readme: README.md
  release_notes: RELEASE_NOTES.md
  author: Nimi Team
local_development:
  electron:
    renderer_origin: http://127.0.0.1:1524
